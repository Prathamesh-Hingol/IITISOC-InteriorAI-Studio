global:
  scrape_interval: 15s
  evaluation_interval: 15s

# k6 pushes metrics directly via HTTP remote-write to:
#   POST /api/v1/write
# The --web.enable-remote-write-receiver flag on Prometheus enables this endpoint.
# No scrape config needed for k6 — Prometheus receives metrics passively.

scrape_configs:
  # Self-monitoring: scrape Prometheus's own metrics
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
