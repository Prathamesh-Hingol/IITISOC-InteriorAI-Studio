services:
  # ─── Prometheus ──────────────────────────────────────────────────────────────
  # Receives k6 metrics via native remote-write (no sidecar needed).
  # remote-write receiver is enabled via the --web.enable-remote-write-receiver flag.
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: interiorai_prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
      - --enable-feature=native-histograms
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Grafana ──────────────────────────────────────────────────────────────────
  # Auto-provisions Prometheus datasource and the official k6 dashboard (ID 2587).
  grafana:
    image: grafana/grafana:11.1.0
    container_name: interiorai_grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"      # 3001 to avoid clash with frontend dev server on 3000
    depends_on:
      prometheus:
        condition: service_healthy
    restart: unless-stopped

  # ─── k6 ───────────────────────────────────────────────────────────────────────
  # NOT started with `up` — run individual scripts with:
  #   docker compose run --rm k6 run /scripts/health.js
  #   docker compose run --rm -e TEST_PRESET=load k6 run /scripts/upload.js
  #
  # Env vars for authenticated tests (set in .env.loadtest or pass via -e):
  #   K6_TOKENS          — comma-separated JWT pool (from generate-tokens.js)
  #   BASE_URL           — backend URL (default: http://host.docker.internal:5000)
  #   TEST_PROJECT_ID    — required for generations.js
  #   TEST_VERSION_ID    — required for editor.js
  #   TEST_IMAGE_URL     — image URL for generations.js / drag.js
  #   TEST_PRESET        — smoke | load | load_ai | stress | stress_ai | soak
  k6:
    image: grafana/k6:0.54.0
    container_name: interiorai_k6
    environment:
      K6_OUT: experimental-prometheus-rw
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      K6_PROMETHEUS_RW_TREND_AS_NATIVE_HISTOGRAM: "true"
      BASE_URL: ${BASE_URL:-http://host.docker.internal:5000}
      K6_TOKENS: ${K6_TOKENS:-}
      TEST_PRESET: ${TEST_PRESET:-smoke}
      TEST_PROJECT_ID: ${TEST_PROJECT_ID:-}
      TEST_VERSION_ID: ${TEST_VERSION_ID:-}
      TEST_MASK_URL: ${TEST_MASK_URL:-}
      TEST_IMAGE_URL: ${TEST_IMAGE_URL:-}
    volumes:
      - .:/scripts:ro
    depends_on:
      prometheus:
        condition: service_healthy
    profiles:
      - runner    # Only starts when explicitly requested

volumes:
  prometheus-data:
  grafana-data:
