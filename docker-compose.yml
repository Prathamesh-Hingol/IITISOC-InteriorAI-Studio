version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: interior-ai-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: interior_ai_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: interior-ai-redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      target: backend
    container_name: interior-ai-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/interior_ai_db?schema=public"
      REDIS_URL: "redis://redis:6379"
    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: ./backend
      target: worker
    container_name: interior-ai-worker
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/interior_ai_db?schema=public"
      REDIS_URL: "redis://redis:6379"
    depends_on:
      - postgres
      - redis
      - backend

  frontend:
    build:
      context: ./frontend
      target: runner
    container_name: interior-ai-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
